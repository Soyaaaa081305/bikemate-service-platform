services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bikemate
      POSTGRES_USER: bikemate
      POSTGRES_PASSWORD: bikemate123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikemate"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=bikemate;Username=bikemate;Password=bikemate123"
      Jwt__Key: "CHANGE_THIS_TO_A_LONG_SECURE_SECRET_32_CHARS"
      Jwt__Issuer: "BikeMate"
      Jwt__Audience: "BikeMateMobile"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--migrate"]

  webadmin:
    build:
      context: .
      dockerfile: Dockerfile.webadmin
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "5266:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BikeMateDb: "Host=postgres;Port=5432;Database=bikemate;Username=bikemate;Password=bikemate123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
